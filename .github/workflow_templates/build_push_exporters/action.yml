name: Build and push exporter image to Quay.io

inputs:
  image:
    required: true
  tags:
    description: Comma separated string with the different image tags
    required: true
  quay_imagenamespace:
    required: true
  quay_username:
    required: true
  quay_password:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set variables
      shell: bash
      env:
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_NAMESPACE: ${{ inputs.quay_imagenamespace }}
        INPUT_IMAGE: ${{ inputs.image }}
      run: |
        FULL_IMAGE_NAME="quay.io/${INPUT_NAMESPACE}/${INPUT_IMAGE}"
        echo "FULL_IMAGE_NAME=$FULL_IMAGE_NAME" >> "$GITHUB_ENV"
        BUILDX_TAGS=""
        for tag in $(echo "$INPUT_TAGS" | tr "," " "); do
          BUILDX_TAGS="${BUILDX_TAGS:+$BUILDX_TAGS,}$FULL_IMAGE_NAME:$tag"
        done
        echo "BUILDX_TAGS=$BUILDX_TAGS" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Quay.io (docker)
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.quay_username }}
        password: ${{ inputs.quay_password }}
        registry: quay.io

    - name: Build and push exporter image
      uses: docker/build-push-action@v6
      with:
        context: ./exporters
        file: ./exporters/Containerfile
        push: true
        tags: ${{ env.BUILDX_TAGS }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
